<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento Ambiental</title>
    <!-- Importando a fonte Inter e ícones do FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Monitor Ambiental</h1>
        <p class="subtitle">Dados em tempo real do ambiente</p>

        <div class="cards-grid">
            <!-- Card de Temperatura -->
            <div class="card temp-card">
                <div class="card-info">
                    <div class="card-title">Temperatura</div>
                    <div class="card-value" id="temp-value">-- °C</div>
                </div>
                <div class="card-icon">
                    <i class="fa-solid fa-temperature-half"></i>
                </div>
            </div>

            <!-- Card de Luminosidade -->
            <div class="card light-card">
                <div class="card-info">
                    <div class="card-title">Luminosidade</div>
                    <div class="card-value" id="light-value">-- lx</div>
                </div>
                <div class="card-icon">
                    <i class="fa-solid fa-sun"></i>
                </div>
            </div>
        </div>

        <div class="status">
            Status do Sistema: <span id="connection-status">Conectado (Simulação)</span>
        </div>
    </div>

    <!-- Script de lógica -->
    <script src="script.js"></script>
</body>
</html>
